[package]
name = "torchio"
version = "4.4.0"
edition = "2024"
rust-version = "1.88"
description = "Break your containers on purpose: burn CPU, hold memory, fill disk and more, on demand over HTTP"
license = "MIT"
repository = "https://github.com/altrdev/torchio"
readme = "README.md"
keywords = ["load-testing", "chaos", "kubernetes", "docker", "stress"]
categories = ["command-line-utilities", "development-tools::testing"]
publish = false
authors = ["altrdev"]

[dependencies]
axum = "0.8"
libc = "0.2.191"
memmap2 = "0.9.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util"] }
tower-http = { version = "0.7.1", features = ["cors"] }
ureq = { version = "3.4.2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util", "macros", "rt", "io-util", "net"] }
tower = { version = "0.5.3", features = ["util"] }

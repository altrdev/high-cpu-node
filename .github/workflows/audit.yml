name: Audit

# A vulnerability can be published for a crate that has not changed, so this also runs every week
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/audit.yml
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Known vulnerabilities in the dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - run: cargo install cargo-audit --locked --version 0.22.1

      # fails on a vulnerability, and only warns on an unmaintained or yanked crate
      - run: cargo audit

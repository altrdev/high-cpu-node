name: Publish Docker image

on:
  push:
    tags:
      - '*'

env:
  TARGET_PLATFORMS: linux/amd64,linux/arm64

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: altrdev/torchio

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.TARGET_PLATFORMS }}

      # The binary alone for each platform, built by the same Dockerfile
      - name: Build the binaries
        run: |
          docker buildx build --target binary --platform "$TARGET_PLATFORMS" --output type=local,dest=dist .
          mkdir release
          cp dist/linux_amd64/torchio release/torchio-linux-amd64
          cp dist/linux_arm64/torchio release/torchio-linux-arm64
          (cd release && sha256sum torchio-linux-* > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## " v " " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md release/*
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes release/*
          fi

      - name: Prepare the Docker Hub README
        # Docker Hub shows every badge on its own row, and it already has its own pull and size figures
        run: grep -v '^\[!\[' README.md > dockerhub-readme.md

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: altrdev/torchio
          short-description: Stress CPU, memory, disk and latency on demand. For testing autoscaling, limits and probes.
          readme-filepath: ./dockerhub-readme.md

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Smoke test
        run: |
          PORT=3100 WORKERS=1 node server.js &
          SERVER_PID=$!
          sleep 2
          test "$(curl -sf localhost:3100/)" = "Status: OK"
          curl -sf "localhost:3100/stress?number=20" | grep -q "result: 6765"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:3100/stress?number=999')" = "400"
          curl -sf "localhost:3100/delay?ms=100" | grep -q "100 ms"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:3100/status/503')" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:3100/status/999')" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:3100/memory?mb=999999')" = "400"
          BASE_RSS=$(ps -o rss= -p $SERVER_PID)
          curl -sf "localhost:3100/memory?mb=200&hold=1" | grep -q "Allocated 200 MB"
          curl -sf localhost:3100/info | jq -e '.memory.heldMb == 200'
          curl -sf localhost:3100/metrics | grep -q '^stress_node_memory_held_bytes 209715200$'
          HELD_RSS=$(ps -o rss= -p $SERVER_PID)
          test $((HELD_RSS - BASE_RSS)) -gt 150000
          sleep 3
          test $(($(ps -o rss= -p $SERVER_PID) - BASE_RSS)) -lt 100000
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:3100/disk?mb=999999')" = "400"
          curl -sf "localhost:3100/disk?mb=20&hold=0" | grep -q "Wrote 20 MB"
          sleep 1
          test -z "$(ls /tmp | grep stress-node-disk- || true)"
          curl -sf localhost:3100/info | jq -e '.name == "stress-node" and .memory.heldMb == 0 and .disk.heldMb == 0 and .delay.inFlight == 0'
          node cli.js watch --once --url http://localhost:3100 | grep -q "Memory held"
          curl -sf localhost:3100/metrics | grep -q '^stress_node_http_requests_total{route="/memory",code="200"} 1$'
          kill $SERVER_PID

      - name: Build Docker image
        run: docker build -t stress-node .

      - name: Test Docker image
        run: |
          docker run -d --name sn -m 256m -p 3200:3000 -e WORKERS=1 stress-node
          for i in $(seq 20); do curl -sf localhost:3200/ >/dev/null && break; sleep 1; done
          test "$(curl -sf localhost:3200/)" = "Status: OK"
          curl -sf "localhost:3200/stress?number=20" | grep -q "result: 6765"
          curl -sf "localhost:3200/memory?mb=50&hold=0" | grep -q "Allocated 50 MB"
          curl -sf "localhost:3200/disk?mb=20&hold=0" | grep -q "Wrote 20 MB"
          curl -sf localhost:3200/info | jq -e '.memory.containerLimitMb == 256'
          curl -sf localhost:3200/metrics | grep -q '^stress_node_container_memory_limit_bytes 268435456$'
          docker exec sn node cli.js watch --once | grep -q "(container)"
          for i in $(seq 60); do
            test "$(docker inspect -f '{{.State.Health.Status}}' sn)" = healthy && break
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' sn)" = healthy

      - name: Container logs
        if: failure()
        run: docker logs sn

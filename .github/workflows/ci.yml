name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable

      # the compiled dependencies, which only change with Cargo.lock
      - uses: Swatinem/rust-cache@v2.9.2

      - name: Changelog has a section for this version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          grep -q "^## $VERSION " CHANGELOG.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }

      - name: The manifests in deploy/ use this version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          grep -q "image: altrdev/torchio:$VERSION\$" deploy/kubernetes/deployment.yaml || { echo "deploy/kubernetes/deployment.yaml does not use altrdev/torchio:$VERSION"; exit 1; }
          grep -q "^version: $VERSION\$" deploy/helm/torchio/Chart.yaml || { echo "deploy/helm/torchio/Chart.yaml has no version $VERSION"; exit 1; }
          grep -q "^appVersion: $VERSION\$" deploy/helm/torchio/Chart.yaml || { echo "deploy/helm/torchio/Chart.yaml has no appVersion $VERSION"; exit 1; }

      - run: cargo fmt --check

      - run: cargo clippy --all-targets --locked -- -D warnings

      # unit tests, the tests of the router, and the integration tests that start the real binary
      - run: cargo test --locked

      - name: Documentation builds without warnings
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The layers of the dependencies are kept between runs, so only torchio itself is compiled again
      - name: Build the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: torchio
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: The image is a single small binary
        run: |
          SIZE=$(docker image inspect -f '{{.Size}}' torchio)
          echo "image size: $SIZE bytes"
          test "$SIZE" -lt 15000000

      - name: Test Docker image
        run: |
          docker run -d --name sn -m 256m -p 3200:3000 -e WORKERS=1 torchio
          for i in $(seq 20); do curl -sf localhost:3200/ >/dev/null && break; sleep 1; done
          test "$(curl -sf localhost:3200/)" = "Status: OK"
          curl -sf "localhost:3200/stress?number=20" | grep -q "result: 6765"
          curl -sf "localhost:3200/memory?mb=50&hold=0" | grep -q "Allocated 50 MB"
          curl -sf "localhost:3200/disk?mb=20&hold=0" | grep -q "Wrote 20 MB"
          curl -sf localhost:3200/info | jq -e '.memory.containerLimitMb == 256'
          curl -sf localhost:3200/metrics | grep -q '^torchio_container_memory_limit_bytes 268435456$'
          docker exec sn torchio watch --once | grep -q "(container)"
          for i in $(seq 60); do
            test "$(docker inspect -f '{{.State.Health.Status}}' sn)" = healthy && break
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' sn)" = healthy

      - name: The memory limit kills the container
        run: |
          docker run -d --name oom -m 256m --memory-swap 256m -e MAX_MEMORY_MB=1024 -p 3202:3000 torchio
          for i in $(seq 20); do curl -sf localhost:3202/ >/dev/null && break; sleep 1; done
          curl -s -m 10 "localhost:3202/memory?mb=400" || true
          # Docker does not always set OOMKilled on the runner: a container that exited with 137 (SIGKILL)
          # while it held more than its limit was killed for memory, which is what is being tested
          for i in $(seq 15); do
            [ "$(docker inspect -f '{{.State.OOMKilled}}' oom)" = true ] && exit 0
            [ "$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' oom)" = "exited 137" ] && exit 0
            sleep 1
          done
          docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' oom
          exit 1

      - name: The CPUs of the container limit the workers
        run: |
          docker run -d --name cpus --cpus 2 -p 3201:3000 torchio
          for i in $(seq 20); do curl -sf localhost:3201/ >/dev/null && break; sleep 1; done
          curl -sf localhost:3201/info | jq -e '.stress.workers == 2'

      - name: Check /metrics with promtool
        run: curl -sf localhost:3200/metrics | docker run -i --rm --entrypoint promtool prom/prometheus:v3.5.0 check metrics

      - name: Container logs
        if: failure()
        run: docker logs sn

  # The same Dockerfile compiles for arm64 on the same runner, without emulation. A job of its own,
  # so that it runs at the same time as the one that builds and tests the amd64 image.
  image-arm64:
    name: Docker image for arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

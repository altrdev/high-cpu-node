name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Smoke test
        run: |
          PORT=3100 WORKERS=1 node server.js &
          SERVER_PID=$!
          sleep 2
          test "$(curl -sf localhost:3100/)" = "Status: OK"
          curl -sf "localhost:3100/stress?number=20" | grep -q "result: 6765"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:3100/stress?number=999')" = "400"
          curl -sf "localhost:3100/delay?ms=100" | grep -q "100 ms"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:3100/status/503')" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:3100/status/999')" = "400"
          kill $SERVER_PID

      - name: Build Docker image
        run: docker build -t stress-node .

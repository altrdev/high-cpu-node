name: Documentation

# The site at torchio.altr.dev: the pages in book/, and the reference of the endpoints, which is
# written from the catalog in src/endpoints.rs. A pull request builds it, to catch a mistake before
# the merge. It is published with a release (a tag) or by hand, so the site describes the version
# that can be installed and not what is in main and not released yet.
on:
  pull_request:
    paths:
      - book/**
      - docs/**
      - skills/**
      - examples/endpoints_reference.rs
      - src/endpoints.rs
      - src/config.rs
      - CHANGELOG.md
      - install.sh
      - .github/workflows/docs.yml
  push:
    tags:
      - 'v*'
  # to publish a correction of the pages without waiting for a release: it publishes the branch chosen
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2.9.2

      # the version of the commit that is built: of the tag for a release, of main for a run by hand
      - name: Write the version in the site
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          printf '%s' "$VERSION" > book/src/version.md
          # the small label next to the title: the stylesheet says "dev", and this rule, which comes last, the version
          printf '\n.menu-title::after { content: "v%s"; }\n' "$VERSION" >> book/theme/torchio.css
          grep -q "content: \"v$VERSION\"" book/theme/torchio.css

      # the images are in docs/, where the README takes them from, and the pages use the same files
      - name: Copy the images next to the pages
        run: mkdir -p book/src/images && cp docs/* book/src/images/

      - name: Write the reference of the endpoints from the catalog
        run: cargo run --locked --example endpoints_reference > book/src/reference.md

      # a prebuilt binary, whose checksum the action verifies
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: mdbook@0.5.4

      - run: mdbook build book

      # the installer, at torchio.altr.dev/install: the one of the commit that is published. The
      # address on raw.githubusercontent.com keeps working, and the script itself downloads the
      # binary from the GitHub release, so a site that is down only takes this copy away.
      - name: Publish the installer next to the pages
        run: |
          head -n 1 install.sh | grep -q '^#!/bin/sh$'
          cp install.sh book/book/install

      # for language models: the index of the pages and all of them in one file (llmstxt.org), and the skill
      # that tells an agent how to run a test, which is also copied to a place that can be curled
      - name: Publish llms.txt, llms-full.txt and the skill next to the pages
        run: |
          python3 book/llms.py book/book
          cp skills/torchio/SKILL.md book/book/SKILL.md
          grep -q '^name: torchio$' book/book/SKILL.md

      # for search engines: the list of the pages, and the robots.txt that points to it
      - name: Publish sitemap.xml and robots.txt next to the pages
        run: python3 book/sitemap.py book/book

      - name: Every link between the pages has a target
        run: python3 book/check-links.py book/book

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: book/book

  deploy:
    name: Publish to GitHub Pages
    # a pull request only builds
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

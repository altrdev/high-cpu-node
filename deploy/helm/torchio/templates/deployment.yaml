apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "torchio.fullname" . }}
  labels:
    {{- include "torchio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "torchio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "torchio.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: torchio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            {{- with .Values.config.workers }}
            - name: WORKERS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.maxMemoryMb }}
            - name: MAX_MEMORY_MB
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.config.ui }}
            - name: UI
              value: "1"
            {{- end }}
            {{- if .Values.config.token }}
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "torchio.fullname" . }}
                  key: token
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # where /disk writes
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>torchio</title>
<link rel="icon" id="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='56' fill='%230f172a'/%3E%3Crect x='82' y='24' width='92' height='18' rx='9' fill='%23e2e8f0'/%3E%3Crect x='118' y='42' width='20' height='30' fill='%2394a3b8'/%3E%3Crect x='34' y='72' width='188' height='24' rx='10' fill='%23e2e8f0'/%3E%3Crect x='50' y='124' width='44' height='88' rx='9' fill='%2322c55e'/%3E%3Crect x='106' y='110' width='44' height='102' rx='9' fill='%23f59e0b'/%3E%3Crect x='162' y='100' width='44' height='112' rx='9' fill='%23ef4444'/%3E%3Crect x='38' y='218' width='180' height='12' rx='6' fill='%2394a3b8'/%3E%3C/svg%3E">
<style>
:root {
    --bg: #f4f5f8; --card: #ffffff; --line: #e1e4ec; --text: #0f172a; --dim: #5b6479; --faint: #8b93a7; --track: #e7eaf2;
    --green: #16a34a; --yellow: #d97706; --red: #dc2626; --blue: #2563eb; --violet: #7c3aed;
    --green-bg: #dcfce7; --yellow-bg: #fef3c7; --red-bg: #fee2e2; --blue-bg: #dbeafe; --violet-bg: #ede9fe;
    --ok-bg: #dcfce7; --bad-bg: #fee2e2; --accent: #2563eb; --code: #f4f5f8; --chip: #eceff5; --logo: #0f172a;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0b1220; --card: #111a2e; --line: #1e2a44; --text: #e2e8f0; --dim: #94a3b8; --faint: #7d8aa5; --track: #1a2540;
        --green: #22c55e; --yellow: #f59e0b; --red: #ef4444; --blue: #3b82f6; --violet: #8b5cf6;
        --green-bg: #0f2a1a; --yellow-bg: #3a2a10; --red-bg: #3a1a1f; --blue-bg: #13264a; --violet-bg: #241b46;
        --ok-bg: #0f2a1a; --bad-bg: #3a1a1f; --accent: #3b82f6; --code: #0b1220; --chip: #16213a; --logo: #16213a;
    }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 22px 16px 40px; }
header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
header svg { width: 30px; height: 30px; flex: none; }
h1 { font-size: 18px; margin: 0; font-weight: 600; }
.dim { color: var(--dim); }
.chip, #meta, #status span { display: inline-flex; align-items: center; font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--chip); border: 1px solid var(--line); color: var(--dim); }
.pill { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; padding: 4px 12px; border-radius: 99px; background: var(--ok-bg); color: var(--green); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
.pill.bad { background: var(--bad-bg); color: var(--red); }
@keyframes pulse { 50% { opacity: 0.35; } }
#status { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; min-height: 24px; }
#lost { display: none; background: var(--bad-bg); color: var(--red); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
[data-tone] { --tone: var(--accent); --tone-bg: var(--chip); }
[data-tone="green"] { --tone: var(--green); --tone-bg: var(--green-bg); }
[data-tone="amber"] { --tone: var(--yellow); --tone-bg: var(--yellow-bg); }
[data-tone="red"] { --tone: var(--red); --tone-bg: var(--red-bg); }
[data-tone="blue"] { --tone: var(--blue); --tone-bg: var(--blue-bg); }
[data-tone="violet"] { --tone: var(--violet); --tone-bg: var(--violet-bg); }
.head { display: flex; align-items: center; gap: 8px; }
.head h3, .head p { margin: 0; }
.ico { width: 26px; height: 26px; flex: none; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--tone-bg); color: var(--tone); }
.ico svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.head p { font-size: 13px; color: var(--dim); }
.val { display: block; font-size: 26px; font-weight: 600; line-height: 1.2; margin-top: 6px; white-space: nowrap; }
.val small { font-size: 14px; font-weight: 400; color: var(--dim); }
.bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin: 8px 0; display: flex; }
.bar div { height: 100%; transition: width 0.3s; }
.spark { display: block; width: 100%; height: 36px; color: var(--blue); }
.spark path { vector-effect: non-scaling-stroke; }
.spark .area { fill: currentColor; opacity: 0.18; stroke: none; }
.spark .line { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
.cap { font-size: 11px; color: var(--faint); margin: 3px 0 0; }
h2 { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 500; margin: 22px 2px 8px; color: var(--dim); }
h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.ctl { border-left: 3px solid var(--tone); border-radius: 4px 12px 12px 4px; }
.ctl h3 { font-size: 14px; margin: 0; font-weight: 600; }
.ctl .head { margin-bottom: 8px; }
.ctl.dangerous { border-color: var(--red); border-left-color: var(--red); background: var(--red-bg); }
.row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); margin: 4px 0; }
.row span { width: 56px; flex: none; }
.row input { flex: 1; min-width: 0; }
.row b { min-width: 56px; text-align: right; font-weight: 600; color: var(--text); flex: none; white-space: nowrap; }
input[type=range] { -webkit-appearance: none; appearance: none; height: 16px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--tone, var(--accent)) var(--pct, 0%), var(--track) var(--pct, 0%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--text); border: 2px solid var(--card); box-sizing: content-box; }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--tone, var(--accent)); }
input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--text); border: 2px solid var(--card); }
.cmd { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--faint); background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; margin: 8px 0 0; word-break: break-all; cursor: copy; }
.cmd::after { content: "copy"; font-family: system-ui, sans-serif; font-size: 10px; flex: none; color: var(--dim); opacity: 0; transition: opacity 0.15s; }
.cmd:hover::after, .cmd.copied::after { opacity: 1; }
.cmd.copied::after { content: "copied"; color: var(--green); }
textarea { width: 100%; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text); background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; resize: vertical; }
button { font: inherit; font-size: 13px; font-weight: 500; width: 100%; margin-top: 8px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; transition: filter 0.15s, transform 0.1s; }
button:hover { background: var(--bg); }
button:active { transform: scale(0.985); }
.ctl button:first-of-type, .ctl button.main { background: var(--tone); border-color: var(--tone); color: #fff; }
.ctl button:first-of-type:hover, .ctl button.main:hover { background: var(--tone); filter: brightness(1.1); }
.ctl button + button { background: transparent; border-color: var(--line); color: var(--text); }
.ctl button + button:hover { background: var(--bg); }
button.danger, .ctl button.danger:first-of-type { background: transparent; color: var(--red); border-color: var(--red); }
button.danger:hover, .ctl button.danger:first-of-type:hover { background: var(--bad-bg); filter: none; }
#log { margin-top: 12px; font: 11px/1.8 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--dim); background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 36px; word-break: break-all; }
#log b { font-weight: 600; }
#log .ok { color: var(--green); } #log .warn { color: var(--yellow); } #log .bad { color: var(--red); }
#log span.t { color: var(--faint); }
</style>
</head>
<body>
<main>
    <header>
        <svg viewBox="0 0 256 256" aria-hidden="true"><rect width="256" height="256" rx="56" fill="var(--logo)"/><rect x="82" y="24" width="92" height="18" rx="9" fill="#e2e8f0"/><rect x="118" y="42" width="20" height="30" fill="#94a3b8"/><rect x="34" y="72" width="188" height="24" rx="10" fill="#e2e8f0"/><rect x="50" y="124" width="44" height="88" rx="9" fill="#22c55e"/><rect x="106" y="110" width="44" height="102" rx="9" fill="#f59e0b"/><rect x="162" y="100" width="44" height="112" rx="9" fill="#ef4444"/></svg>
        <h1 id="name">torchio</h1>
        <span id="meta"></span>
        <span class="pill" id="ready">connecting</span>
    </header>
    <p id="status"></p>
    <div id="lost"></div>
    <div class="grid" id="gauges"></div>
    <h2>Run a test</h2>
    <div class="grid" id="controls"></div>
    <div id="log">Nothing sent yet. Each button shows the request it makes.</div>
</main>
<script>
'use strict';
const HISTORY = 60;
const $ = (id) => document.getElementById(id);
const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
};
const level = (ratio) => (ratio >= 0.85 ? 'var(--red)' : ratio >= 0.6 ? 'var(--yellow)' : 'var(--green)');
// Keeps the end of a long path, which is the part that tells directories apart
const shorten = (text, max) => (text.length > max ? `…${text.slice(text.length - max + 1)}` : text);
const duration = (s) => {
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h ? `${h}h${m}m${s % 60}s` : m ? `${m}m${s % 60}s` : `${s}s`;
};

// small outline icons (24x24 paths), so the page needs no font or file
const ICONS = {
    cpu: '<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
    memory: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
    disk: '<path d="M3 14h18v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 14l3-9h12l3 9M7 17.5h.01M11 17.5h.01"/>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/>',
    swap: '<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    pulse: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
    lines: '<path d="M4 6h16M4 12h16M4 18h10"/>',
    flame: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/>',
    pause: '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
    zap: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
    drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
    trend: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
    box: '<path d="M12 3l8 4v10l-8 4-8-4V7zM4 7l8 4 8-4M12 11v10"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    play: '<path d="M7 4l13 8-13 8z"/>',
};
function icon(name) {
    const node = el('span', 'ico');
    node.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
    return node;
}
// icon and color of each card, by what it touches: compute, memory, storage, network, process
const LOOK = {
    'CPU level': ['cpu', 'amber'], 'CPU request': ['zap', 'amber'], 'Memory': ['memory', 'green'], 'Memory leak': ['drop', 'green'],
    'Disk': ['disk', 'violet'], 'Connections': ['link', 'blue'], 'File descriptors': ['file', 'violet'], 'Readiness': ['pulse', 'green'],
    'Delay': ['clock', 'blue'], 'Status': ['info', 'blue'], 'Flaky': ['trend', 'amber'], 'Payload': ['box', 'blue'], 'Log': ['lines', 'blue'],
    'Block': ['pause', 'red'], 'Crash': ['flame', 'red'], 'Scenario': ['play', 'violet'],
};
function heading(card, title) {
    const [name, tone] = LOOK[title] || ['info', 'blue'];
    card.dataset.tone = tone;
    const head = el('div', 'head');
    head.append(icon(name), el('h3', '', title));
    card.append(head);
}

// ---- gauges: what /info says, with the last HISTORY samples of each
const history = {};
const gauges = [
    {key: 'cpu', label: 'CPU load', icon: 'cpu', tone: 'amber', get: (i) => {
      // what /stress keeps busy counts as 100, the other workers as much as /cpu burns
      const busy = i.stress.perWorker.filter((n) => n > 0).length, w = i.stress.workers;
      const burn = i.stress.burn ? i.stress.burn.percent : 0;
      // /cpu loads the first workers, all of them unless it was asked for fewer
      const burned = i.stress.burn ? (i.stress.burn.workers ?? w) : 0;
      let load = 0;
      for (let n = 0; n < w; n++) load += i.stress.perWorker[n] > 0 ? 100 : n < burned ? burn : 0;
      return {v: load, max: w * 100, text: `${w ? Math.round(load / w) : 0}%`, cap: `${busy} busy with /stress` + (i.stress.burn ? `, ${burn}% /cpu on ${burned < w ? `${burned} of ${w} workers` : 'every worker'}` : '')};
    }},
    {key: 'mem', label: 'Memory held', icon: 'memory', tone: 'green', get: (i) => ({v: i.memory.heldMb, max: i.memory.limitMb, text: `${i.memory.heldMb} / ${i.memory.limitMb} MB`, cap: '/memory and /leak'})},
    {key: 'rss', label: 'Process RSS', icon: 'swap', tone: 'blue', get: (i) => {
        const limit = i.memory.containerLimitMb;
        return {v: i.memory.processRssMb, max: limit || Math.max(i.memory.limitMb, ...(history.rss || [])), neutral: !limit,
            text: limit ? `${i.memory.processRssMb} / ${limit} MB` : `${i.memory.processRssMb} MB`, cap: limit ? 'container limit' : 'no container limit'};
    }},
    {key: 'disk', label: 'Disk held', icon: 'disk', tone: 'violet', get: (i) => ({v: i.disk.heldMb, max: i.disk.limitMb, text: `${i.disk.heldMb} / ${i.disk.limitMb} MB`, cap: i.disk.freeMb === null ? 'directory not usable' : `${i.disk.freeMb} MB free in ${shorten(i.disk.dir, 24)}`})},
];

const gaugeNodes = {};
const SVG = 'http://www.w3.org/2000/svg';
function buildGauge(key, label, iconName, tone) {
    const card = el('div', 'card');
    card.dataset.tone = tone;
    const head = el('div', 'head');
    head.append(icon(iconName), el('p', '', label));
    const value = el('strong', 'val');
    const bar = el('div', 'bar');
    const fill = el('div');
    bar.append(fill);
    const spark = document.createElementNS(SVG, 'svg');
    spark.setAttribute('class', 'spark');
    spark.setAttribute('viewBox', '0 0 100 36');
    spark.setAttribute('preserveAspectRatio', 'none');
    for (const name of ['area', 'line']) {
        const path = document.createElementNS(SVG, 'path');
        path.setAttribute('class', name);
        spark.append(path);
    }
    const cap = el('p', 'cap');
    card.append(head, value, bar, spark, cap);
    $('gauges').append(card);
    gaugeNodes[key] = {value, fill, spark, cap, bar};
    history[key] = [];
}

// the last HISTORY samples as a line with the area under it, each one as a share of `top`
function plot(spark, h, top, color) {
    const [area, line] = spark.querySelectorAll('path');
    const at = (n) => {
        const idx = n - (HISTORY - h.length);
        const ratio = idx >= 0 ? Math.min(h[idx] / top, 1) : 0;
        return `${((n / (HISTORY - 1)) * 100).toFixed(1)} ${(34 - ratio * 32).toFixed(1)}`;
    };
    const points = Array.from({length: HISTORY}, (_, n) => at(n));
    line.setAttribute('d', `M${points.join('L')}`);
    area.setAttribute('d', `M${points.join('L')}L100 36L0 36Z`);
    if (color) spark.style.color = color;
}

function draw(key, {v, max, text, cap, neutral}) {
    const node = gaugeNodes[key];
    const ratio = max > 0 ? Math.min(v / max, 1) : 0;
    const space = text.indexOf(' ');
    node.value.replaceChildren(...(space < 0 ? [text] : [text.slice(0, space), el('small', '', text.slice(space))]));
    node.cap.textContent = cap;
    node.fill.style.width = `${ratio * 100}%`;
    const color = neutral ? 'var(--blue)' : level(ratio);
    node.fill.style.background = color;
    const h = history[key];
    h.push(v);
    if (h.length > HISTORY) h.shift();
    plot(node.spark, h, max > 0 ? max : 1, color);
}

// ---- requests: the counters of /metrics (the polling of this page is left out)
let previousTotal = null;
const classes = [['2xx', 'var(--green)'], ['3xx', 'var(--blue)'], ['4xx', 'var(--yellow)'], ['5xx', 'var(--red)']];
function requests(metrics) {
    const byClass = {};
    let total = 0;
    for (const m of metrics.matchAll(/^torchio_http_requests_total\{route="([^"]*)",code="(\d)\d\d"\} (\d+)$/gm)) {
        if (['/info', '/metrics', '/ui', 'other'].includes(m[1])) continue;
        byClass[m[2] + 'xx'] = (byClass[m[2] + 'xx'] || 0) + Number(m[3]);
        total += Number(m[3]);
    }
    const rate = previousTotal === null ? 0 : Math.max(0, total - previousTotal);
    previousTotal = total;

    const node = gaugeNodes.req;
    const h = history.req;
    h.push(rate);
    if (h.length > HISTORY) h.shift();
    const top = Math.max(1, ...h);
    plot(node.spark, h, top, 'var(--blue)');
    node.bar.replaceChildren(...classes.map(([name, color]) => {
        const part = el('div');
        part.style.width = `${total ? ((byClass[name] || 0) / total) * 100 : 0}%`;
        part.style.background = color;
        return part;
    }));
    const main = classes.map(([name]) => name).sort((a, b) => (byClass[b] || 0) - (byClass[a] || 0))[0];
    node.value.replaceChildren(...(total ? [main, el('small', '', ` ${Math.round(((byClass[main] || 0) / total) * 100)}%`)] : ['none yet']));
    node.cap.textContent = `${total} answered, ${rate} in the last second`;
}

// ---- controls: one card for each endpoint, with the request it will make
const log = [];
function getToken() {
    try {
        return sessionStorage.getItem('torchio-token') || '';
    } catch (e) {
        return '';
    }
}
function setToken(value) {
    try {
        sessionStorage.setItem('torchio-token', value);
    } catch (e) {}
}
// the token is asked for only when the server answers 401, and kept for this tab
async function request(url, init = {}) {
    const call = () => {
        const token = getToken();
        return fetch(url, {...init, signal: AbortSignal.timeout(120000), headers: token ? {Authorization: `Bearer ${token}`} : {}});
    };
    let res = await call();
    if (res.status === 401) {
        const token = window.prompt('This server needs a token (TOKEN)');
        if (token) {
            setToken(token);
            res = await call();
        }
    }
    return res;
}
function send(url, button, init = {}) {
    const entry = {url, method: init.method || 'GET', time: new Date().toTimeString().slice(0, 8), code: '…', tone: '', body: ''};
    log.unshift(entry);
    if (log.length > 6) log.pop();
    const show = () => $('log').replaceChildren(...log.map((e) => {
        const row = el('div');
        row.append(el('span', 't', e.time), ' ', el('b', e.tone, e.code), el('span', '', ` ${e.method} ${e.url}  ${e.body}`));
        return row;
    }));
    show();
    const started = performance.now();
    request(url, init)
        .then(async (res) => {
            entry.code = String(res.status);
            entry.tone = res.status >= 500 ? 'bad' : res.status >= 400 ? 'warn' : 'ok';
            entry.body = `${(await res.text()).slice(0, 120)} · ${Math.round(performance.now() - started)} ms`;
        })
        .catch((e) => {
            entry.code = 'ERR';
            entry.tone = 'bad';
            entry.body = `no answer (${e.name === 'TimeoutError' ? 'timed out' : 'connection lost'})`;
        })
        .finally(show);
}

// a slider with its name and its value, for the cards: `onInput` runs when it moves
function addSlider(card, p, onInput) {
    const row = el('div', 'row');
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min;
    input.max = p.max;
    input.step = p.step || 1;
    input.value = Math.min(p.value, p.max);
    const out = el('b');
    const show = () => {
        out.textContent = `${input.value}${p.unit || ''}`;
        input.style.setProperty('--pct', `${((input.value - input.min) / (input.max - input.min || 1)) * 100}%`);
    };
    input.addEventListener('input', () => {
        show();
        onInput();
    });
    show();
    row.append(el('span', '', p.label), input, out);
    card.append(row);
    return input;
}

function buildControl(def) {
    const card = el('div', 'card ctl' + (def.danger ? ' dangerous' : ''));
    heading(card, def.title);
    const inputs = {};
    const cmd = el('p', 'cmd');
    const query = () => def.params.map((p) => `${p.name}=${inputs[p.name].value}`).join('&');
    const urlFor = (path) => (def.params.length && path === def.path ? `${path}?${query()}` : path);
    const refresh = () => (cmd.textContent = `curl "${urlFor(def.path)}"`);
    for (const p of def.params) inputs[p.name] = addSlider(card, p, refresh);
    card.append(cmd);
    for (const action of def.actions) {
        const button = el('button', def.danger ? 'danger' : '', action.label);
        let armed = null;
        button.addEventListener('click', () => {
            if (def.danger && !armed) {
                button.textContent = 'Click again to confirm';
                armed = setTimeout(() => {
                    armed = null;
                    button.textContent = action.label;
                }, 3000);
                return;
            }
            clearTimeout(armed);
            armed = null;
            button.textContent = action.label;
            send(urlFor(action.path || def.path), button);
        });
        card.append(button);
    }
    refresh();
    $('controls').append(card);
}

function buildControls(info) {
    const hold = info.limits.maxHoldSeconds;
    const secs = (name, value) => ({name, label: name, min: 0, max: hold, value, step: 1, unit: ' s'});
    [
        {title: 'CPU level', path: '/cpu', params: [{name: 'percent', label: 'percent', min: 0, max: 100, value: 70, step: 5, unit: '%'}, secs('hold', 60), {name: 'workers', label: 'workers', min: 1, max: info.stress.workers, value: info.stress.workers}], actions: [{label: 'Start'}]},
        {title: 'CPU request', path: '/stress', params: [{name: 'number', label: 'number', min: 0, max: info.limits.maxNumber, value: 40}], actions: [{label: 'Run'}]},
        {title: 'Memory', path: '/memory', params: [{name: 'mb', label: 'mb', min: 1, max: info.memory.limitMb, value: 100, unit: ' MB'}, secs('hold', 20)], actions: [{label: 'Allocate'}]},
        {title: 'Memory leak', path: '/leak', params: [{name: 'rate', label: 'rate', min: 1, max: info.memory.limitMb, value: 10, unit: ' MB/s'}, {name: 'mb', label: 'up to', min: 1, max: info.memory.limitMb, value: 200, unit: ' MB'}, secs('hold', 20)], actions: [{label: 'Start'}]},
        {title: 'Disk', path: '/disk', params: [{name: 'mb', label: 'mb', min: 1, max: info.disk.limitMb, value: 100, unit: ' MB'}, secs('hold', 20)], actions: [{label: 'Write'}]},
        ...(info.connections ? [{title: 'Connections', path: '/connections', params: [{name: 'count', label: 'count', min: 1, max: info.connections.limit, value: 50}, secs('hold', 20)], actions: [{label: 'Open'}]}] : []),
        {title: 'File descriptors', path: '/fd', params: [{name: 'count', label: 'count', min: 1, max: info.fd ? info.fd.limit : 10000, value: 500}, secs('hold', 20)], actions: [{label: 'Open'}]},
        {title: 'Readiness', path: '/ready/off', params: [{name: 'seconds', label: 'seconds', min: 0, max: hold, value: 60, unit: ' s'}], actions: [{label: 'Make not ready'}, {label: 'Ready again', path: '/ready/on'}]},
        {title: 'Delay', path: '/delay', params: [{name: 'ms', label: 'ms', min: 0, max: info.limits.maxDelayMs, value: 3000, step: 100}], actions: [{label: 'Wait'}]},
        buildStatus,
        buildFlaky,
        buildPayload,
        {title: 'Log', path: '/log', params: [{name: 'lines', label: 'lines', min: 1, max: info.limits.maxLogLines, value: 1000, step: 100}, {name: 'rate', label: 'rate', min: 1, max: info.limits.maxLogRate, value: 100, step: 10, unit: ' lines/s'}], actions: [{label: 'Write'}]},
        {title: 'Block', path: '/block', danger: true, params: [{name: 'ms', label: 'ms', min: 1, max: info.limits.maxBlockMs, value: Math.min(5000, info.limits.maxBlockMs), step: 500}], actions: [{label: 'Freeze the server'}]},
        {title: 'Crash', path: '/crash', danger: true, params: [{name: 'code', label: 'exit code', min: 0, max: 255, value: 137}, secs('after', 0)], actions: [{label: 'End the process'}]},
    ].forEach((item) => (typeof item === 'function' ? item(info) : buildControl(item)));
    buildScenario();
}

// ---- cards that do more than one request: a status, a share of failures, a body
const MB = 1024 * 1024;
const megabytes = (bytes) => `${(bytes / MB).toFixed(1)} MB`;
const speed = (bytes, seconds) => (seconds > 0 ? `${(bytes / MB / seconds).toFixed(1)} MB/s` : '- MB/s');
function button(card, label, onClick) {
    const b = el('button', '', label);
    b.addEventListener('click', onClick);
    card.append(b);
    return b;
}
// the line of a card where what its buttons did is written
function noteOf(card) {
    const line = el('p', 'cap');
    card.append(line);
    return line;
}

function buildStatus() {
    const card = el('div', 'card ctl');
    heading(card, 'Status');
    const cmd = el('p', 'cmd');
    const code = addSlider(card, {label: 'code', min: 200, max: 599, value: 503}, () => refresh());
    const refresh = () => (cmd.textContent = `curl -i "/status/${code.value}"`);
    card.append(cmd);
    button(card, 'Ask', (event) => send(`/status/${code.value}`, event.target));
    refresh();
    $('controls').append(card);
}

// the failures come from the requests that arrive, so a button sends a batch and counts
function buildFlaky(info) {
    const card = el('div', 'card ctl');
    heading(card, 'Flaky');
    const cmd = el('p', 'cmd');
    const inputs = {
        rate: addSlider(card, {label: 'rate', min: 0, max: 100, value: 30, step: 5, unit: '%'}, () => refresh()),
        code: addSlider(card, {label: 'code', min: 400, max: 599, value: 503}, () => refresh()),
        ms: addSlider(card, {label: 'ms', min: 0, max: info.limits.maxDelayMs, value: 0, step: 100}, () => refresh()),
    };
    const url = () => `/flaky?rate=${inputs.rate.value}&code=${inputs.code.value}&ms=${inputs.ms.value}`;
    const refresh = () => (cmd.textContent = `curl "${url()}"`);
    card.append(cmd);
    button(card, 'One request', (event) => send(url(), event.target));
    const note = noteOf(card);
    const BATCH = 20;
    button(card, `Send ${BATCH} requests`, async () => {
        note.textContent = `Sending ${BATCH}…`;
        const statuses = await Promise.all(
            Array.from({length: BATCH}, () => fetch(url(), {signal: AbortSignal.timeout(120000)}).then((r) => r.status, () => 0)),
        );
        const failed = statuses.filter((status) => status >= 400).length;
        const lost = statuses.filter((status) => status === 0).length;
        note.textContent = `${failed} of ${BATCH} failed with ${inputs.code.value}, ${BATCH - failed - lost} answered 200${lost ? `, ${lost} got no answer` : ''}. Asked for ${inputs.rate.value}%.`;
    });
    refresh();
    $('controls').append(card);
}

// a body in each direction: the browser counts what it gets and what it sends, so the road in between is the one tested
function buildPayload(info) {
    const max = info.limits.maxPayloadMb;
    // the browser keeps what it sends in memory, so an upload is smaller than the limit of the server
    const maxUpload = Math.min(max, 200);
    const card = el('div', 'card ctl');
    heading(card, 'Payload');
    const cmd = el('p', 'cmd');
    const down = addSlider(card, {label: 'download', min: 1, max, value: Math.min(10, max), unit: ' MB'}, () => refresh());
    const up = addSlider(card, {label: 'upload', min: 1, max: maxUpload, value: Math.min(10, maxUpload), unit: ' MB'}, () => refresh());
    const refresh = () => (cmd.textContent = `curl -o /dev/null "/payload?mb=${down.value}"`);
    card.append(cmd);
    const note = noteOf(card);

    const download = async () => {
        const started = performance.now();
        note.textContent = 'Asking…';
        try {
            const res = await request(`/payload?mb=${down.value}`);
            if (!res.ok) return void (note.textContent = `${res.status} ${await res.text()}`);
            const announced = Number(res.headers.get('content-length')) || null;
            const reader = res.body.getReader();
            let got = 0;
            let shown = 0;
            for (;;) {
                const {done, value} = await reader.read();
                if (done) break;
                got += value.length;
                if (performance.now() - shown > 100) {
                    shown = performance.now();
                    note.textContent = `Receiving… ${megabytes(got)} of ${down.value} MB`;
                }
            }
            const seconds = (performance.now() - started) / 1000;
            note.textContent = announced && announced !== got
                ? `The body was cut short: ${got} of ${announced} bytes`
                : `Received ${megabytes(got)} in ${seconds.toFixed(2)} s (${speed(got, seconds)})`;
        } catch (e) {
            note.textContent = `The body did not arrive: ${e.name === 'TimeoutError' ? 'timed out' : e.message}`;
        }
    };
    const upload = async (body) => {
        const started = performance.now();
        note.textContent = `Sending ${megabytes(body.size)}…`;
        try {
            const res = await request('/payload', {method: 'POST', body});
            const text = await res.text();
            const seconds = (performance.now() - started) / 1000;
            if (!res.ok) return void (note.textContent = `${res.status} ${text}`);
            const report = JSON.parse(text);
            note.textContent = `Sent ${megabytes(body.size)} in ${seconds.toFixed(2)} s (${speed(body.size, seconds)}), the server counted ${report.bytes} bytes`;
        } catch (e) {
            note.textContent = 'The connection was closed while the body was being sent. A limit on the size of the body, here or on the way?';
        }
    };
    // random bytes, so nothing on the way can make the body smaller by compressing it
    const generated = () => {
        const piece = new Uint8Array(MB);
        for (let at = 0; at < MB; at += 65536) crypto.getRandomValues(piece.subarray(at, at + 65536));
        return new Blob(Array.from({length: Number(up.value)}, () => piece));
    };
    const picker = document.createElement('input');
    picker.type = 'file';
    picker.hidden = true;
    picker.addEventListener('change', () => {
        if (picker.files[0]) upload(picker.files[0]);
        picker.value = '';
    });

    button(card, 'Download', download);
    button(card, 'Upload generated data', () => upload(generated()));
    button(card, 'Upload a file…', () => picker.click());
    card.append(picker);
    refresh();
    $('controls').append(card);
}

// ---- scenario: a list of steps, started and stopped from here
const EXAMPLE = [{cpu: 80, seconds: 20}, {memory: 100, seconds: 20}, {ready: 'off', seconds: 10}];
function buildScenario() {
    const card = el('div', 'card ctl');
    card.id = 'scenario';
    heading(card, 'Scenario');
    const text = document.createElement('textarea');
    text.rows = 5;
    text.spellcheck = false;
    // a step on each line
    text.value = `[\n${EXAMPLE.map((step) => ` ${JSON.stringify(step)}`).join(',\n')}\n]`;
    const now = el('p', 'cap');
    now.id = 'scenario-now';
    const start = el('button', '', 'Start the scenario');
    start.addEventListener('click', () => send('/scenario', start, {method: 'POST', body: text.value}));
    const stop = el('button', '', 'Stop it');
    stop.addEventListener('click', () => send('/scenario', stop, {method: 'DELETE'}));
    card.append(text, now, start, stop, el('p', 'cmd', 'curl -X POST -d @scenario.json "/scenario"'));
    $('controls').append(card);
}
function scenarioText(s) {
    if (!s || s.state === 'idle') return 'No scenario has run.';
    if (s.state === 'running') return `Step ${s.step} of ${s.steps}, ${s.secondsLeft} s left in it, ${s.remainingSeconds} s in all.`;
    if (s.state === 'failed') return `Failed: ${s.error}`;
    if (s.state === 'stopped') return `Stopped at step ${s.step} of ${s.steps}.`;
    return `Finished, ${s.steps} steps.`;
}

// ---- tab: the logo and the title tell at a glance when the server is not ready or not there
let tabState = null;
function setTab(state, title) {
    document.title = title;
    if (state === tabState) return;
    tabState = state;
    const bars = state === 'ok' ? ['#22c55e', '#f59e0b', '#ef4444'] : ['#ef4444', '#ef4444', '#ef4444'];
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect width="256" height="256" rx="56" fill="${state === 'ok' ? '#0f172a' : '#450a0a'}"/>`
        + `<rect x="82" y="24" width="92" height="18" rx="9" fill="#e2e8f0"/><rect x="118" y="42" width="20" height="30" fill="#94a3b8"/><rect x="34" y="72" width="188" height="24" rx="10" fill="#e2e8f0"/>`
        + `<rect x="50" y="124" width="44" height="88" rx="9" fill="${bars[0]}"/><rect x="106" y="110" width="44" height="102" rx="9" fill="${bars[1]}"/>`
        + `<rect x="162" y="100" width="44" height="112" rx="9" fill="${bars[2]}"/><rect x="38" y="218" width="180" height="12" rx="6" fill="#94a3b8"/></svg>`;
    $('icon').href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
}

// a click on a command copies it
document.addEventListener('click', (event) => {
    const cmd = event.target.closest('.cmd');
    if (!cmd || !navigator.clipboard) return;
    navigator.clipboard.writeText(cmd.textContent).then(() => {
        cmd.classList.add('copied');
        setTimeout(() => cmd.classList.remove('copied'), 1200);
    }, () => {});
});

// ---- the loop
let built = false;
let ticking = false;
async function tick() {
    if (ticking) return;
    ticking = true;
    try {
        const [info, metrics] = await Promise.all([
            fetch('/info', {signal: AbortSignal.timeout(2000)}).then((r) => r.json()),
            fetch('/metrics', {signal: AbortSignal.timeout(2000)}).then((r) => r.text()),
        ]);
        if (!built) {
            built = true;
            gauges.forEach((g) => buildGauge(g.key, g.label, g.icon, g.tone));
            buildGauge('fd', 'File descriptors held', 'file', 'violet');
            if (info.connections) buildGauge('connections', 'Connections held', 'link', 'blue');
            buildGauge('req', 'Requests by status', 'swap', 'blue');
            buildControls(info);
        }
        $('lost').style.display = 'none';
        $('name').textContent = info.name;
        $('meta').textContent = `${info.version} · ${location.host} · up ${duration(info.uptimeSeconds)}`;

        const ready = $('ready');
        const state = info.ready || {ready: true, secondsLeft: null};
        ready.className = 'pill' + (state.ready ? '' : ' bad');
        ready.textContent = state.ready ? 'ready' : state.secondsLeft === null ? 'not ready, until /ready/on' : `not ready, ready again in ${state.secondsLeft} s`;

        setTab(state.ready ? 'ok' : 'bad', state.ready ? `${info.name} ${info.version}` : `${info.name} · not ready`);

        const status = [`/stress in progress: ${info.stress.inFlight}`, `/delay waiting: ${info.delay.inFlight}`];
        if (info.stress.burn) {
            const n = info.stress.burn.workers ?? info.stress.workers;
            status.unshift(`/cpu: ${info.stress.burn.percent}% on ${n < info.stress.workers ? `${n} of ${info.stress.workers} workers` : 'every worker'}, ${info.stress.burn.secondsLeft} s left`);
        }
        if (info.scenario && info.scenario.state === 'running') status.unshift(`/scenario: step ${info.scenario.step} of ${info.scenario.steps}, ${info.scenario.remainingSeconds} s left`);
        if ($('scenario-now')) $('scenario-now').textContent = scenarioText(info.scenario);
        if (info.log) status.unshift(`/log: ${info.log.sent} of ${info.log.lines} lines, ${info.log.rate} lines/s`);
        $('status').replaceChildren(...status.map((text) => el('span', '', text)));

        gauges.forEach((g) => draw(g.key, g.get(info)));
        if (info.connections) draw('connections', {v: info.connections.held, max: info.connections.limit, text: `${info.connections.held} / ${info.connections.limit}`, cap: 'held by /connections'});
        if (info.fd) {
            const byProcess = info.fd.processLimit != null && info.fd.processLimit < info.fd.limit;
            const max = byProcess ? info.fd.processLimit : info.fd.limit;
            draw('fd', {v: info.fd.held, max, text: `${info.fd.held} / ${max}`, cap: byProcess ? 'held by /fd, process limit (ulimit -n)' : 'held by /fd'});
        }
        requests(metrics);
    } catch (e) {
        setTab('bad', 'torchio · unreachable');
        $('lost').style.display = 'block';
        $('lost').textContent = `Cannot reach the server (${e.name === 'TimeoutError' ? 'timed out' : e.message}). Trying again every second.`;
    }
    ticking = false;
}
tick();
setInterval(tick, 1000);
</script>
</body>
